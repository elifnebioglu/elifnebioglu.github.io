    - title: "AI-Generated Image Detectors Overrely on Global Artifacts: Evidence from Inpainting Exchange"
      year: 2026
      description:
        - "Nebioglu, E.*, Bilgiç, E.*, Popescu, A. arXiv:2602.00192, 2026 (under review). *Equal contribution."
        - Introduced INP-X, a diagnostic method exposing shortcut learning in AI-generated image detectors by removing global VAE artifacts. Evaluated 13 detectors on a 90K-image benchmark, showing accuracy drops from 91% to ~55%.

